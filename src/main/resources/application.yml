spring:
  application:
    name: be-session

  datasource:
    url: jdbc:mysql://localhost:3306/likelion?serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # 1. SQL을 예쁘게 포맷팅해서 출력하고, 바인딩 파라미터 값을 주석으로 표시합니다.
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true

# 2. 바인딩되는 실제 파라미터 값(?에 들어갈 내용)을 로그로 상세히 출력합니다.
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    com.likjelion.besession: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.orm.jdbc.bind: trace

cors:
  allowed-origins: http://localhost:8080

jwt:
  secret: likelion-be-session-secret-key-must-be-at-least-32-bytes
  access-token-expiration: 1800000
  refresh-token-expiration: 2592000000
