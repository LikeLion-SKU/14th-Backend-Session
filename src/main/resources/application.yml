spring:
  application:
    name: be-session

  datasource:
    url: jdbc:mysql://localhost:3306/likelion
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

cors:
  allowed-origin: http://localhost:3000, http://localhost:5173

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000